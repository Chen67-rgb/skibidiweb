{% extends 'layouts/base.html' %}

{% block content %}

<h1>Tasks</h1>

<!-- note: this is a chentask -->
{% for task in tasks %}

<div>
    <h2>{% if task.done == False %} ⏲ {% else %} 🍋 {% endif %}
    {{task.title}}</h2>

    <p>{{task.description}}</p>
    <p>Project: {{task.project.name}}</p>
    <button> 
        Delete
    </button>
    <button>
        ☑ Great Job!
    </button>
</div>

{% endfor %}

{% endblock %}
