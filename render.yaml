databases:
  - name: chendb
    plan: free
    databaseName: chen
    user: yulian

services:
  - type: web
    plan: free
    name: chen
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn chen.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chendb
          property: connectionString
      - key: django-insecure-ruc7z#f9$mcmr915n$t6bovwj+7rnse5lcl=wjiqm*)*kut7@x
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4